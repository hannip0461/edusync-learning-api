<text x="96" y="664" text-anchor="start" fill="#FFFFFF" font-size="16" font-weight="700">핵심 보장</text>
<text x="96" y="698" text-anchor="start" fill="#CBD5E1" font-size="14" font-weight="400">중복 요청은 한 번만 반영하고, 늦게 도착한 이벤트는 이어보기 위치를 되돌리지 않으며, 완료 상태와 기존 조회 계약을 유지한다.</text>
