openapi: 3.0.3
info:
  title: EduSync Learning API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    인증된 학습 이벤트를 수집하고 SQL Server 기반 진행 상태를 관리하며,
    보호자 권한을 확인한 진행 조회를 제공합니다. 기존 IIS 환경을 위한
    선택적 읽기 전용 Classic ASP 어댑터도 포함합니다. 정적 로컬 자격
    증명은 개발 환경에서만 사용합니다.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: 애플리케이션과 SQL Server 상태 확인
      security: []
      responses:
        '200':
          description: PDO_SQLSRV 연결과 SELECT 1 확인에 성공했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
        '503':
          description: SQL Server 연결 또는 상태 확인에 실패했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailure'
  /api/v1/learning-events:
    post:
      operationId: createLearningEvent
      summary: 웹 또는 모바일 학습 이벤트 수신
      description: |
        로컬 개발용 Bearer 토큰은 설정된 학습자 한 명과 서버가 정규화한
        `source` 하나를 인증합니다. `learner_id`는 인증된 학습자와 일치해야
        하며 클라이언트는 `source`를 지정할 수 없습니다. 운영 사용자 인증을
        대체하는 방식은 아닙니다.
      security:
        - learnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningEventInput'
      responses:
        '200':
          description: 이벤트를 반영했거나 의미상 동일한 중복 요청입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWriteResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/player-events:
    post:
      operationId: receivePlayerEvent
      summary: 서버 간 플레이어 콜백 수신
      description: |
        이 HMAC은 학습자 한 명이 아니라 신뢰된 발행자를 인증합니다. 따라서
        Bearer 경로와 달리 `learner_id` 소유권을 확인하지 않으며, 비밀값을 가진
        발행자는 여러 학습자의 이벤트를 보낼 수 있습니다. 학습자와 강의 존재,
        활성 수강, 수강 기간과 미래 시각 제한은 그대로 적용합니다.
        `PLAYER_HMAC_SECRET`은 신뢰 경계 안에서만 배포해야 합니다.

        서버는 인증된 발행자 설정으로 `source`를 정규화하며 클라이언트는 이를
        지정할 수 없습니다. HMAC-SHA256 정규 입력은
        `X-Player-Timestamp + "\n" + 원본 HTTP 요청 본문`입니다. 타임스탬프는
        ASCII 10진수 헤더 원문을 사용하고, 서명 전에 본문을 파싱하거나 다시
        직렬화하거나 공백을 정규화하지 않습니다.
        `X-Player-Signature: sha256=<소문자 16진수 HMAC 64자리>`와 선행 0이
        없는 Unix 초 타임스탬프를 전송합니다. 단, 값 `0`은 허용합니다.
        서버와의 절대 시간 차이는 `HMAC_TOLERANCE_SECONDS`를 넘을 수 없으며
        기본값은 300초입니다.

        nonce 저장소는 없습니다. 허용 시간 안에 같은 서명 요청을 재전송하면
        인증은 통과하지만 `(source, event_id)` 유니크 제약과 `payload_hash` 비교로
        `{"applied": false, "duplicate": true}`를 반환하며 상태는 바뀌지 않습니다.
        멱등이 아닌 부수 효과가 생기면 nonce 저장소가 필요합니다(DECISIONS D11).
      security:
        - playerHmac: []
      parameters:
        - $ref: '#/components/parameters/PlayerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningEventInput'
      responses:
        '200':
          description: 이벤트를 반영했거나 의미상 동일한 중복 요청입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWriteResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/guardians/{guardianId}/learners/{learnerId}/progress:
    get:
      operationId: getGuardianLearnerProgress
      summary: 연결된 학습자 한 명의 강의 진행 상태 조회
      description: 로컬 개발용 보호자 Bearer 토큰은 설정된 보호자 한 명에 대응합니다. 경로의 `guardianId`가 인증된 보호자와 일치하고 `guardian_links`에 `learnerId`와의 연결이 있어야 합니다.
      security:
        - guardianBearer: []
      parameters:
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/LearnerId'
      responses:
        '200':
          description: 연결된 학습자의 강의별 진행 상태입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianProgressResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /progress.asp:
    get:
      operationId: getClassicAspProgress
      summary: Classic ASP 어댑터를 통한 진행 상태 조회
      description: |
        읽기 전용 SQL Server 로그인으로 동작하는 선택적 Windows IIS 엔드포인트입니다.
        사용자 인증은 없으며 호출자의 네트워크 주소를 경계로 사용합니다.
        ASP 소스는 쿼리 문자열을 읽거나 데이터베이스에 연결하기 전에
        `127.0.0.0/8` 또는 `::1`이 아닌 호출자를 403으로 거부합니다.
        리버스 프록시 뒤에서는 프록시가 호출자로 인식되므로 사용하지 않습니다.
      servers:
        - url: http://127.0.0.1:8091
      security: []
      parameters:
        - name: learner_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: lecture_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 읽기 전용 Classic ASP 어댑터가 반환한 진행 상태입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicAspProgress'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The caller is not a loopback peer.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /docs:
    get:
      operationId: getDocumentation
      summary: 대화형 OpenAPI 문서 제공
      security: []
      responses:
        '200':
          description: 대화형 API 문서입니다.
components:
  securitySchemes:
    learnerBearer:
      type: http
      scheme: bearer
      description: APP_BEARER_LEARNER_ID에 대응하는 정적 로컬 개발용 토큰입니다.
    guardianBearer:
      type: http
      scheme: bearer
      description: GUARDIAN_BEARER_ID에 대응하는 정적 로컬 개발용 토큰입니다.
    playerHmac:
      type: apiKey
      in: header
      name: X-Player-Signature
      description: >-
        PLAYER_HMAC_SECRET으로 `X-Player-Timestamp + "\n" + 원본 HTTP 요청 본문`을
        계산한 `sha256=<소문자 16진수 64자리>` 값입니다. 학습자 한 명이 아닌
        신뢰된 발행자를 인증하므로 여러 `learner_id`의 쓰기를 허용합니다.
  parameters:
    PlayerTimestamp:
      name: X-Player-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]{0,15})$'
      description: HMAC 정규 입력에 변경 없이 포함되는 Unix 초 단위 원문 값입니다.
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    LearnerId:
      name: learnerId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: JSON 형식, 필드 타입 또는 값이 잘못됐거나 알 수 없는 필드가 있습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: 필수 인증이 없거나 유효하지 않거나 HMAC 허용 시간 범위를 벗어났습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: 인증 주체가 일치하지 않거나 보호자 연결 또는 유효한 수강 등록이 없습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: 요청한 학습자, 보호자 또는 강의가 존재하지 않습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: 정규화된 source와 event_id가 이미 다른 payload에 사용됐습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unprocessable:
      description: "`occurred_at`이 수강 기간 밖이거나 서버가 기록한 `received_at`보다 5분을 초과해 미래입니다."
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalError:
      description: 예상하지 못한 서버 오류이며 내부 구현 정보는 노출하지 않습니다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    HealthSuccess:
      type: object
      required: [status, database, driver, probe]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [connected] }
        driver: { type: string, enum: [pdo_sqlsrv] }
        probe: { type: integer, enum: [1] }
    HealthFailure:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [error] }
        database: { type: string, enum: [unavailable] }
    LearningEventInput:
      type: object
      additionalProperties: false
      required: [event_id, learner_id, lecture_id, session_id, sequence_no, event_type, position_seconds, occurred_at]
      properties:
        event_id: { type: string, minLength: 1, maxLength: 100 }
        learner_id: { type: integer, format: int64, minimum: 1 }
        lecture_id: { type: integer, format: int64, minimum: 1 }
        session_id: { type: string, minLength: 1, maxLength: 100 }
        sequence_no: { type: integer, format: int64, minimum: 0 }
        event_type: { type: string, enum: [CHECKPOINT, COMPLETED] }
        position_seconds: { type: integer, minimum: 0, maximum: 2147483647 }
        occurred_at:
          type: string
          format: date-time
          description: Z 또는 +/-HH:MM 시간대를 명시하고 최대 밀리초 정밀도를 사용하는 RFC3339 타임스탬프입니다.
    EventWriteResult:
      type: object
      additionalProperties: false
      required: [applied, duplicate]
      properties:
        applied: { type: boolean }
        duplicate: { type: boolean }
    GuardianProgressResponse:
      type: object
      additionalProperties: false
      required: [guardian_id, learner_id, progress]
      properties:
        guardian_id: { type: integer, format: int64 }
        learner_id: { type: integer, format: int64 }
        progress:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lecture_id, resume_position_seconds, furthest_position_seconds, last_studied_at, completed_at]
            properties:
              lecture_id: { type: integer, format: int64 }
              resume_position_seconds: { type: integer, minimum: 0 }
              furthest_position_seconds: { type: integer, minimum: 0 }
              last_studied_at: { type: string, format: date-time, nullable: true }
              completed_at: { type: string, format: date-time, nullable: true }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [status, message, correlation_id]
          properties:
            status: { type: integer }
            message: { type: string }
            correlation_id: { type: string }
    ClassicAspProgress:
      type: object
      required: [learner_id, lecture_id, resume_position_seconds, furthest_position_seconds, last_studied_at, completed_at]
      properties:
        learner_id: { type: integer, format: int64 }
        lecture_id: { type: integer, format: int64 }
        resume_position_seconds: { type: integer, minimum: 0 }
        furthest_position_seconds: { type: integer, minimum: 0 }
        last_studied_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
